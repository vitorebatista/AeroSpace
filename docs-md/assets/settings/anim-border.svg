<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: the focused-window border appearing, then thickening and rounding its corners">
  <rect x="30" y="16" width="260" height="88" rx="10" fill="#8b93a7" fill-opacity="0.22"/>
  <rect x="34" y="20" width="252" height="80" rx="4" fill="none" stroke="#12b981" stroke-width="0" opacity="0">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.95;1" values="0;0;1;1;0"/>
    <animate attributeName="stroke-width" dur="7s" repeatCount="indefinite" keyTimes="0;0.2;0.45;0.7;0.95;1" values="4;4;10;10;4;4"/>
    <animate attributeName="rx" dur="7s" repeatCount="indefinite" keyTimes="0;0.45;0.7;0.95;1" values="2;2;18;18;2"/>
  </rect>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">Border off
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.95;1" values="1;1;0;0;1"/>
    </text>
    <text x="160" y="133" opacity="0">width 4 · radius 2
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.45;0.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="160" y="133" opacity="0">width 10 · radius 18
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;0.55;0.9;0.95;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>

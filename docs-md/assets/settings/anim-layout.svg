<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: three windows switching between the tiles layout and the accordion layout">
  <rect x="10" y="10" width="300" height="100" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <g fill="#6366f1" fill-opacity="0.8">
    <rect y="20" height="80" rx="4" x="20" width="92">
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="92;92;30;30;92"/>
    </rect>
    <rect y="20" height="80" rx="4" x="118" width="92">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="118;118;54;54;118"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="92;92;212;212;92"/>
    </rect>
    <rect y="20" height="80" rx="4" x="216" width="94">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="216;216;270;270;216"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="94;94;40;40;94"/>
    </rect>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">Tiles
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="1;1;0;0;1"/>
    </text>
    <text x="160" y="133" opacity="0">Accordion
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="0;0;1;1;0"/>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: a container holding a single window collapses, so that window becomes a direct child of the row">
  <rect x="10" y="10" width="300" height="100" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <!-- the container that has only one child -->
  <rect x="164" y="16" width="142" height="88" rx="6" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="1;1;0;0;1"/>
  </rect>
  <g fill="#6366f1" fill-opacity="0.8">
    <rect x="20" y="20" width="140" height="80" rx="4"/>
    <rect x="172" y="24" width="126" height="72" rx="4">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="172;172;166;166;172"/>
      <animate attributeName="y" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="24;24;20;20;24"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="126;126;140;140;126"/>
      <animate attributeName="height" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="72;72;80;80;72"/>
    </rect>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">Container with a single child
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.4;0.9;0.95;1" values="1;1;0;0;1;1"/>
    </text>
    <text x="160" y="133" opacity="0">Flattened
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.4;0.9;0.95;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: a redundant nested container disappearing and its two windows joining the parent row as equal columns">
  <rect x="10" y="10" width="300" height="100" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <!-- the redundant same-orientation container -->
  <rect x="162" y="16" width="144" height="88" rx="6" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="1;1;0;0;1"/>
  </rect>
  <g fill="#6366f1" fill-opacity="0.8">
    <rect x="20" y="20" width="140" height="80" rx="4">
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="140;140;92;92;140"/>
    </rect>
    <rect x="168" y="20" width="68" height="80" rx="4">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="168;168;118;118;168"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="68;68;92;92;68"/>
    </rect>
    <rect x="240" y="20" width="64" height="80" rx="4">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="240;240;216;216;240"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.9;1" values="64;64;94;94;64"/>
    </rect>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">Redundant container
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.4;0.9;0.95;1" values="1;1;0;0;1;1"/>
    </text>
    <text x="160" y="133" opacity="0">Flattened
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.4;0.9;0.95;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: accordion padding growing from 0 to 60, exposing tab-like strips of the neighbouring windows">
  <rect x="10" y="10" width="300" height="100" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <!-- neighbouring windows, revealed as strips by the padding -->
  <g fill="#6366f1" fill-opacity="0.45">
    <rect x="20" y="20" width="60" height="80" rx="4"/>
    <rect x="250" y="20" width="56" height="80" rx="4"/>
  </g>
  <!-- the focused accordion window shrinks as the padding grows -->
  <rect x="20" y="20" width="286" height="80" rx="4" fill="#6366f1" fill-opacity="0.85">
    <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="20;48;48;20"/>
    <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="286;230;230;286"/>
  </rect>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">accordion-padding = 0
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.3;0.35;0.65;0.7;1" values="1;1;0;0;1;1"/>
    </text>
    <text x="160" y="133" opacity="0">accordion-padding = 30
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.3;0.35;0.65;0.7;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>

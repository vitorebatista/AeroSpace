<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170" role="img"
     aria-label="Animation: with the option off a new window flashes at its native position before being tiled; with it on the window appears already tiled">
  <g font-family="system-ui, sans-serif" font-size="12" fill="#8b93a7" text-anchor="middle">
    <text x="82" y="18" font-weight="600">Off</text>
    <text x="238" y="18" font-weight="600">On</text>
  </g>
  <rect x="12" y="26" width="140" height="90" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <rect x="168" y="26" width="140" height="90" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>

  <!-- existing window on each side -->
  <rect x="20" y="34" width="64" height="74" rx="4" fill="#6366f1" fill-opacity="0.35"/>
  <rect x="176" y="34" width="64" height="74" rx="4" fill="#6366f1" fill-opacity="0.35"/>

  <!-- Off: flashes at the app's own position, then snaps into the tile -->
  <rect x="52" y="52" width="76" height="52" rx="4" fill="#6366f1" fill-opacity="0.9" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.25;0.3;0.55;0.6;0.95;1" values="0;0;1;1;1;1;0"/>
    <animate attributeName="x" dur="5s" repeatCount="indefinite" keyTimes="0;0.3;0.55;0.6;1" values="52;52;52;88;88"/>
    <animate attributeName="y" dur="5s" repeatCount="indefinite" keyTimes="0;0.3;0.55;0.6;1" values="52;52;52;34;34"/>
    <animate attributeName="width" dur="5s" repeatCount="indefinite" keyTimes="0;0.3;0.55;0.6;1" values="76;76;76;56;56"/>
    <animate attributeName="height" dur="5s" repeatCount="indefinite" keyTimes="0;0.3;0.55;0.6;1" values="52;52;52;74;74"/>
  </rect>

  <!-- On: nothing is shown until the tile is ready -->
  <rect x="244" y="34" width="56" height="74" rx="4" fill="#6366f1" fill-opacity="0.9" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.55;0.6;0.95;1" values="0;0;1;1;0"/>
  </rect>

  <text x="160" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#8b93a7" text-anchor="middle">
    A new window is detected
  </text>
  <text x="160" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#8b93a7" text-anchor="middle" opacity="0.8">
    Off shows the native position first; On waits for the first layout
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: a workspace's first split flipping between horizontal and vertical">
  <rect x="10" y="10" width="300" height="100" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <g fill="#6366f1" fill-opacity="0.8">
    <rect x="20" y="20" width="140" height="80" rx="4">
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="140;140;280;280;140"/>
      <animate attributeName="height" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="80;80;38;38;80"/>
    </rect>
    <rect x="166" y="20" width="140" height="80" rx="4">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="166;166;20;20;166"/>
      <animate attributeName="y" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="20;20;62;62;20"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="140;140;280;280;140"/>
      <animate attributeName="height" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="80;80;38;38;80"/>
    </rect>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">Horizontal
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="1;1;0;0;1"/>
    </text>
    <text x="160" y="133" opacity="0">Vertical
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.9;1" values="0;0;1;1;0"/>
    </text>
  </g>
</svg>

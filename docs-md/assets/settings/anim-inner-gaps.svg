<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 148" width="320" height="148" role="img"
     aria-label="Animation: the inner gap between two tiled windows growing from 0 to 24 points">
  <rect x="10" y="10" width="300" height="100" rx="8" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
  <g fill="#6366f1" fill-opacity="0.8">
    <rect x="20" y="20" width="143" height="80" rx="4">
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="143;131;131;143"/>
    </rect>
    <rect x="163" y="20" width="143" height="80" rx="4">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="163;175;175;163"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="143;131;131;143"/>
    </rect>
  </g>
  <!-- the gap itself -->
  <rect x="163" y="20" width="0" height="80" fill="#22d3ee" fill-opacity="0.55">
    <animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="163;151;151;163"/>
    <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.65;1" values="0;24;24;0"/>
  </rect>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="133">gaps.inner.horizontal = 0
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.3;0.35;0.65;0.7;1" values="1;1;0;0;1;1"/>
    </text>
    <text x="160" y="133" opacity="0">gaps.inner.horizontal = 24
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.3;0.35;0.65;0.7;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
